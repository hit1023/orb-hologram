<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>ORB Hologram</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; touch-action: manipulation; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #ui { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
        display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-items: center;
        background: linear-gradient(transparent, rgba(0,0,0,.85)); transition: opacity .4s; font: 14px/1.4 system-ui, sans-serif; color: #cde; }
  #ui.hidden { opacity: 0; pointer-events: none; }
  button, select { font: inherit; color: #def; background: #123; border: 1px solid #357; border-radius: 10px; padding: 10px 14px; min-height: 44px; }
  button.on { background: #0a6; border-color: #3fc; color: #fff; }
  label { display: flex; align-items: center; gap: 6px; }
  input[type=range] { width: 110px; }
  #say { flex: 1 1 180px; min-width: 0; font: inherit; color: #def; background: #0a1520; border: 1px solid #357; border-radius: 10px; padding: 10px 12px; min-height: 44px; box-sizing: border-box; }
  #log { position: fixed; top: calc(8px + env(safe-area-inset-top)); left: 12px; right: 12px; font: 12px/1.5 system-ui, sans-serif; color: #7ab; pointer-events: none; white-space: pre-wrap; }
  #log.hidden { display: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="log"></div>
<div id="ui">
  <select id="char" aria-label="キャラ">
    <option value="mascot">ルミ(かわいい)</option>
    <option value="ring">リング</option>
    <option value="dancer">ダンス</option>
    <option value="orb">球体</option>
  </select>
  <select id="mode" aria-label="表示モード">
    <option value="plain">通常(画面で確認)</option>
    <option value="board">斜め板(1枚)</option>
    <option value="pyramid">ピラミッド(4方向)</option>
  </select>
  <button id="mic">マイク開始</button>
  <input id="say" placeholder="話しかける(文字でもOK)" enterkeyhint="send">
  <label>大きさ<input id="size" type="range" min="25" max="100" value="60"></label>
  <label>位置<input id="pos" type="range" min="0" max="100" value="50"></label>
  <button id="hide">UIを隠す</button>
</div>
<script>
'use strict';
/* ===== 設定 ===== */
const CONFIG = {
  // 返答API: POST {text, history} → {reply, emotion}。TTS: POST {text, emotion} → mp3。STT: WebSocket(16kHz PCM)
  chatEndpoint: '/api/chat',
  ttsEndpoint: '/api/tts',
  sttPath: '/ws/stt',
  lang: 'ja-JP',
};

/* ===== 状態 ===== */
// idle(待機) / listening(聞いている) / thinking(考え中) / speaking(話している)
const PALETTE = {
  idle:      { h: 200, s: 90, l: 62 },
  listening: { h: 150, s: 90, l: 60 },
  thinking:  { h: 265, s: 85, l: 68 },
  speaking:  { h: 28,  s: 95, l: 64 },
};
let state = 'idle';
let level = 0;          // 0..1 聞く/話すの音量
let levelSmooth = 0;
const cur = { ...PALETTE.idle };   // なめらかに変化する現在色
let t0 = performance.now();

const $ = id => document.getElementById(id);
const cv = $('c'), ctx = cv.getContext('2d');
const dancerImage = new Image();
let dancerImageReady = false;
let dancerImageError = false;
dancerImage.onload = () => { dancerImageReady = true; };
dancerImage.onerror = () => { dancerImageError = true; };
dancerImage.src = 'dancer-concept.png?v=1';
let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
}
addEventListener('resize', resize); resize();

function setState(s) { state = s; log(); }
function log(extra) {
  $('log').textContent = `状態: ${({idle:'待機',listening:'聞いている',thinking:'考え中',speaking:'話している'})[state]}` + (extra ? '\n' + extra : '');
  // 「あなた:」「ルミ:」は大きな字幕・帯で出すので、板に映す字幕に出すのはエラーや案内だけ
  if (extra && !/^(あなた|ルミ|認識中)/.test(extra)) setNotice(extra);
}
// 左上の小さな状態表示は、板に映ると邪魔なので通常モード(画面確認)のときだけ出す
function applyLogVisibility() { $('log').style.display = $('mode').value === 'plain' ? '' : 'none'; }

/* ===== 球体の描画(加算合成。黒背景ほど明るく見える) ===== */
function hsl(h, s, l, a) { return `hsla(${h},${s}%,${l}%,${a})`; }
function lerp(a, b, k) { return a + (b - a) * k; }

/* ===== 字幕: 話しかけた言葉(認識結果)・ルミの返事・案内/エラー =====
   板で正しい向きに映る(反転した空間で描く)。文字の大きさは言葉ごとにバラバラ。横スクロールはしない。
   ルミが話し始めるまでは話しかけた言葉、話し始めたら返事を、声に合わせて少しずつ出す。 */
const CAP_FONT = '"Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif';
let userCap = { text: '', at: -1e9, partial: false }, notice = { text: '', at: -1e9 };
let replyCap = { text: '', started: false, at: 0, dur: 0, endAt: 0 };
function setUserCap(t, partial) { userCap = { text: t, at: performance.now(), partial: !!partial }; }
function setNotice(t) { notice = { text: t, at: performance.now() }; }

function capInfo() {
  const now = performance.now();
  if (now - notice.at < 6000) return { text: notice.text, life: 6000 - (now - notice.at), kind: 'notice', progress: 1 };
  if (replyCap.text && replyCap.started) {
    if (!replyCap.endAt) return { text: replyCap.text, life: 1e9, kind: 'reply', progress: replyCap.dur ? Math.min(1, (now - replyCap.at) / replyCap.dur) : 1 };
    const left = 6000 - (now - replyCap.endAt);
    if (left > 0) return { text: replyCap.text, life: left, kind: 'reply', progress: 1 };
  }
  if (!userCap.text) return null;
  const age = now - userCap.at;
  const waiting = state === 'thinking' || (state === 'speaking' && !replyCap.started);
  const life = userCap.partial ? 4000 - age : waiting ? 1e9 : 6000 - age;
  return life > 0 && age < 30000 ? { text: userCap.text, life, kind: 'user', progress: 1, partial: userCap.partial } : null;
}

function hash32(s) { let h = 2166136261; for (const c of s) { h ^= c.codePointAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
const segmenter = (typeof Intl !== 'undefined' && Intl.Segmenter) ? new Intl.Segmenter('ja', { granularity: 'word' }) : null;
function splitChunks(text) {
  const raw = [];
  if (segmenter) for (const s of segmenter.segment(text)) raw.push(s.segment);
  else { let i = 0; while (i < text.length) { const n = 2 + (hash32(text.slice(i, i + 3)) % 3); raw.push(text.slice(i, i + n)); i += n; } }
  const out = [];
  for (const c of raw) {                                            // 句読点は前の語に付ける。長すぎる語は分ける
    if (/^[、。！？!?,.…・]+$/.test(c) && out.length) { out[out.length - 1] += c; continue; }
    for (let i = 0; i < c.length; i += 6) out.push(c.slice(i, i + 6));
  }
  return out;
}
function chunkScale(chunk, idx, seed) {
  const h = hash32(chunk + idx + seed), plain = chunk.replace(/[、。！？!?,.…・\s]/g, '');
  if (!plain) return 1;
  if (/^[぀-ゟ]+$/.test(plain) && plain.length <= 2) return 0.78 + (h % 10) / 100;   // 助詞など: 小さく
  const r = (h % 100) / 100;
  return /[一-鿿゠-ヿ0-9A-Za-z]/.test(plain) ? 1.15 + r * 0.55 : 0.9 + r * 0.35; // 漢字・カタカナ・英数: 大きく
}
const capCache = { key: '', lay: null };
function layoutCaption(text, base, maxW) {
  const key = `${text}|${Math.round(base)}|${Math.round(maxW)}`;
  if (capCache.key === key) return capCache.lay;
  const chunks = splitChunks(text.replace(/\n+/g, ' '));
  let idx = 0;
  const items = chunks.map((t, i) => {
    const s = chunkScale(t, i, text.length);
    ctx.font = `bold ${base * s}px ${CAP_FONT}`;
    const it = { t, s, w: ctx.measureText(t).width, j: (hash32(t + i) % 100) / 100 - 0.5, start: idx };
    idx += t.length; return it;
  });
  const lines = []; let line = { items: [], w: 0, s: 1 };
  for (const it of items) {
    if (line.items.length && line.w + it.w > maxW) { lines.push(line); line = { items: [], w: 0, s: 1 }; }
    line.items.push(it); line.w += it.w; line.s = Math.max(line.s, it.s);
  }
  if (line.items.length) lines.push(line);
  let y = 0;
  for (const l of lines) { l.h = base * l.s * 1.3; l.y = y; y += l.h; }
  capCache.key = key; capCache.lay = { lines, h: y, len: idx };
  return capCache.lay;
}

function drawCaption(R, cap) {
  let base = Math.max(18, Math.min(R * 0.30, W * 0.06));
  const maxW = W * 0.88;
  ctx.save();
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  let lay = layoutCaption(cap.text, base, maxW);
  while (lay.h > H * 0.34 && base > 14) { base *= 0.9; lay = layoutCaption(cap.text, base, maxW); }
  // 画面からはみ出さないように位置を調整する(板で上下反転していても、画面上の位置で判断)
  let top = R * 2.05;
  const m = ctx.getTransform(), d = m.d / DPR;
  if (Math.abs(d) > 0.001) {
    const scr = y => m.f / DPR + d * y;
    const a1 = scr(top), a2 = scr(top + lay.h), lo = Math.min(a1, a2), hi = Math.max(a1, a2);
    const limitBot = H - ($('ui').classList.contains('hidden') ? 10 : $('ui').offsetHeight + 10);
    let shift = 0;
    if (hi > limitBot) shift = limitBot - hi; else if (lo < 10) shift = 10 - lo;
    top += shift / d;
  }
  const n = Math.ceil(lay.len * cap.progress);                      // 返事は声に合わせて出す字数
  const a = Math.min(1, cap.life / 1200) * (cap.partial ? 0.8 : 1);
  ctx.shadowColor = hsl(cur.h, 90, 70, a * 0.9); ctx.shadowBlur = base * 0.5;
  for (const l of lay.lines) {
    let x = -l.w / 2;
    const bl = top + l.y + base * l.s * 1.0;
    for (const it of l.items) {
      if (it.start >= n) break;
      const t = it.start + it.t.length <= n ? it.t : it.t.slice(0, n - it.start);
      ctx.font = `bold ${base * it.s}px ${CAP_FONT}`;
      ctx.fillStyle = cap.kind === 'notice' ? `rgba(255,190,110,${a})` : hsl(cur.h, it.s > 1.1 ? 70 : 25, it.s > 1.1 ? 90 : 96, a * (it.s < 0.95 ? 0.85 : 1));
      ctx.fillText(t, x, bl + it.j * base * 0.25);
      x += it.w;
    }
  }
  ctx.restore();
}
// 全キャラ共通で呼ばれる。字幕があるときだけ出す(流れる帯はなし)
function drawTicker(R, time) { const cap = capInfo(); if (cap) drawCaption(R, cap); }

function drawOrb(R, time) {
  // 呼び出し側で原点=球の中心にしてある
  const p = PALETTE[state];
  const k = 0.06;
  cur.h += (((p.h - cur.h + 540) % 360) - 180) * k;   // 色相は最短経路で補間
  cur.h = (cur.h + 360) % 360;
  cur.s = lerp(cur.s, p.s, k); cur.l = lerp(cur.l, p.l, k);
  levelSmooth = lerp(levelSmooth, level, 0.25);
  const lv = levelSmooth;

  // 常に動き続ける: ゆっくりふわふわ漂い、呼吸し、表面が波打つ
  ctx.translate(Math.sin(time * 0.7) * R * 0.07, Math.sin(time * 1.1 + 1) * R * 0.09);
  const breathe = 1 + Math.sin(time * 1.4) * 0.06 + Math.sin(time * 2.3) * 0.015;
  const energy = state === 'idle' ? 0.26 : state === 'thinking' ? 0.3 : 0.32 + lv * 0.9;
  ctx.globalCompositeOperation = 'lighter';

  // 外側の光(ハロー)
  const halo = ctx.createRadialGradient(0, 0, R * 0.2, 0, 0, R * (1.9 + lv * 0.6));
  halo.addColorStop(0, hsl(cur.h, cur.s, cur.l, 0.35 + lv * 0.25));
  halo.addColorStop(1, hsl(cur.h, cur.s, cur.l, 0));
  ctx.fillStyle = halo;
  ctx.beginPath(); ctx.arc(0, 0, R * (1.9 + lv * 0.6), 0, Math.PI * 2); ctx.fill();

  drawTicker(R, time);

  // 本体: 音量で表面がうねるブロブ(重ね描きでガラス玉っぽく)
  for (let layer = 0; layer < 3; layer++) {
    const lr = R * (1 - layer * 0.08) * breathe;
    const N = 72;
    ctx.beginPath();
    for (let i = 0; i <= N; i++) {
      const a = (i / N) * Math.PI * 2;
      const wob =
        Math.sin(a * 3 + time * (1.2 + layer * 0.5)) * 0.5 +
        Math.sin(a * 5 - time * (1.7 + layer * 0.3)) * 0.3 +
        Math.sin(a * 2 + time * 0.7) * 0.4;
      const rr = lr * (1 + wob * energy * 0.45);
      const x = Math.cos(a) * rr, y = Math.sin(a) * rr;
      i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    }
    ctx.closePath();
    const g = ctx.createRadialGradient(-lr * 0.3, -lr * 0.35, lr * 0.05, 0, 0, lr * 1.05);
    g.addColorStop(0, hsl(cur.h, cur.s - 10, 82, 0.75));
    g.addColorStop(0.35, hsl(cur.h, cur.s, cur.l - 2, 0.5));
    g.addColorStop(1, hsl(cur.h, cur.s, cur.l - 30, 0.22));
    ctx.fillStyle = g; ctx.fill();
  }

  // 輪郭の光
  ctx.lineWidth = Math.max(1.5, R * 0.025);
  ctx.strokeStyle = hsl(cur.h, cur.s, cur.l + 12, 0.85);
  ctx.beginPath(); ctx.arc(0, 0, R * breathe * (1 + lv * 0.06), 0, Math.PI * 2); ctx.stroke();

  // 球の表面に散らした光の点を回転させて立体に見せる(手前=大きく明るい / 奥=小さく暗い)
  const NS = 90, tilt = 0.45, spin = time * (state === 'thinking' ? 1.4 : 0.6);
  for (let i = 0; i < NS; i++) {
    const phi = Math.acos(1 - 2 * (i + 0.5) / NS);
    const th = i * 2.399963 + spin;
    const x0 = Math.sin(phi) * Math.cos(th), y0 = Math.cos(phi), z0 = Math.sin(phi) * Math.sin(th);
    const y1 = y0 * Math.cos(tilt) - z0 * Math.sin(tilt);
    const z1 = y0 * Math.sin(tilt) + z0 * Math.cos(tilt);
    const dep = (z1 + 1) / 2;
    ctx.fillStyle = hsl(cur.h, cur.s, 60 + dep * 30, 0.12 + dep * dep * 0.85);
    ctx.beginPath(); ctx.arc(x0 * R * 0.97, y1 * R * 0.97, R * (0.012 + 0.03 * dep), 0, Math.PI * 2); ctx.fill();
  }

  // 常時: 球のまわりをゆっくり回る小さな光の粒(状態を問わず動き続ける)
  for (let i = 0; i < 6; i++) {
    const a = time * (0.35 + i * 0.05) + i * 1.05;
    const rr = R * (1.55 + Math.sin(time * 0.9 + i * 2) * 0.15);
    ctx.fillStyle = hsl(cur.h, cur.s, 85, 0.5 + Math.sin(time * 2 + i) * 0.25);
    ctx.beginPath(); ctx.arc(Math.cos(a) * rr, Math.sin(a) * rr * 0.8, R * (0.025 + (i % 3) * 0.01), 0, Math.PI * 2); ctx.fill();
  }

  // 状態ごとの演出
  if (state === 'listening') {            // 声に合わせて広がる波紋
    for (let i = 0; i < 3; i++) {
      const ph = ((time * 0.8 + i / 3) % 1);
      ctx.strokeStyle = hsl(cur.h, cur.s, cur.l + 10, (1 - ph) * (0.25 + lv * 0.6));
      ctx.lineWidth = Math.max(1, R * 0.02);
      ctx.beginPath(); ctx.arc(0, 0, R * (1.05 + ph * (0.6 + lv * 0.5)), 0, Math.PI * 2); ctx.stroke();
    }
  } else if (state === 'thinking') {      // 周回する光の粒
    for (let i = 0; i < 9; i++) {
      const a = time * 2.2 + i * (Math.PI * 2 / 9);
      const rr = R * (1.3 + Math.sin(time * 2 + i) * 0.08);
      ctx.fillStyle = hsl(cur.h, cur.s, 80, 0.85);
      ctx.beginPath(); ctx.arc(Math.cos(a) * rr, Math.sin(a) * rr * 0.9, R * 0.045, 0, Math.PI * 2); ctx.fill();
    }
  } else if (state === 'speaking') {      // 話すリズムで脈打つリング
    ctx.strokeStyle = hsl(cur.h, cur.s, cur.l + 14, 0.2 + lv * 0.6);
    ctx.lineWidth = Math.max(1.5, R * 0.03);
    ctx.beginPath(); ctx.arc(0, 0, R * (1.15 + lv * 0.35), 0, Math.PI * 2); ctx.stroke();
  }
  ctx.globalCompositeOperation = 'source-over';
}


/* ===== リング状のキャラ: 3つの輪が立体的に回る ===== */
function rot3(x, y, z, ax, ay, az) {
  let y1 = y * Math.cos(ax) - z * Math.sin(ax), z1 = y * Math.sin(ax) + z * Math.cos(ax); y = y1; z = z1;
  let x1 = x * Math.cos(ay) + z * Math.sin(ay); z1 = -x * Math.sin(ay) + z * Math.cos(ay); x = x1; z = z1;
  x1 = x * Math.cos(az) - y * Math.sin(az); y1 = x * Math.sin(az) + y * Math.cos(az);
  return [x1, y1, z1];
}

function drawRing(R, time) {
  const p = PALETTE[state];
  const k = 0.06;
  cur.h += (((p.h - cur.h + 540) % 360) - 180) * k;
  cur.h = (cur.h + 360) % 360;
  cur.s = lerp(cur.s, p.s, k); cur.l = lerp(cur.l, p.l, k);
  levelSmooth = lerp(levelSmooth, level, 0.25);
  const lv = levelSmooth;

  ctx.translate(Math.sin(time * 0.7) * R * 0.05, Math.sin(time * 1.1 + 1) * R * 0.07);
  ctx.globalCompositeOperation = 'lighter';
  drawTicker(R, time);

  const sp = state === 'thinking' ? 2.4 : state === 'speaking' ? 1.3 + lv * 2.5 : state === 'listening' ? 1.1 : 0.8;
  const grow = state === 'speaking' ? 1 + lv * 0.25 : 1 + Math.sin(time * 1.4) * 0.03;
  const lw = Math.max(2, R * 0.05);

  // 中心の光(芯)
  const cr = R * (0.2 + lv * 0.18) * (1 + Math.sin(time * 2.2) * 0.08);
  const core = ctx.createRadialGradient(0, 0, 0, 0, 0, cr * 2.4);
  core.addColorStop(0, hsl(cur.h, cur.s - 10, 88, 0.95));
  core.addColorStop(0.4, hsl(cur.h, cur.s, cur.l, 0.5));
  core.addColorStop(1, hsl(cur.h, cur.s, cur.l, 0));
  ctx.fillStyle = core; ctx.beginPath(); ctx.arc(0, 0, cr * 2.4, 0, Math.PI * 2); ctx.fill();

  const rings = [
    { r: 1.00, ax: time * 0.9 * sp,       ay: 0.35,                  az: 0.2 },
    { r: 0.80, ax: 1.1,                   ay: time * 1.1 * sp,       az: time * 0.2 },
    { r: 0.60, ax: time * 0.7 * sp + 2,   ay: time * 0.5 * sp,       az: 0.9 },
  ];
  const N = 96;
  rings.forEach((rg, idx) => {
    const rr = R * rg.r * grow;
    let prev = null;
    for (let i = 0; i <= N; i++) {
      const t = (i / N) * Math.PI * 2;
      const [x, y, z] = rot3(Math.cos(t), Math.sin(t), 0, rg.ax, rg.ay, rg.az);
      const sc = 1 / (1 - z * 0.2);
      const q = [x * rr * sc, y * rr * sc, z];
      if (prev) {
        const d = ((q[2] + prev[2]) / 2 + 1) / 2;
        ctx.strokeStyle = hsl(cur.h, cur.s, 50 + d * 25, 0.18 + d * 0.6);
        ctx.lineWidth = lw * (0.45 + d * 0.9);
        ctx.lineCap = 'butt';
        ctx.beginPath(); ctx.moveTo(prev[0], prev[1]); ctx.lineTo(q[0], q[1]); ctx.stroke();
      }
      prev = q;
    }
    // 輪の上を走る光の玉(動きが見える)
    const beads = state === 'thinking' ? 3 : 1;
    for (let b = 0; b < beads; b++) {
      const t = time * sp * (1.2 + idx * 0.3) * (idx % 2 ? -1 : 1) + b * (Math.PI * 2 / beads) + idx;
      const [x, y, z] = rot3(Math.cos(t), Math.sin(t), 0, rg.ax, rg.ay, rg.az);
      const sc = 1 / (1 - z * 0.2), d = (z + 1) / 2;
      ctx.fillStyle = hsl(cur.h, cur.s - 10, 92, 0.35 + d * 0.65);
      ctx.beginPath(); ctx.arc(x * rr * sc, y * rr * sc, R * (0.035 + 0.04 * d), 0, Math.PI * 2); ctx.fill();
    }
  });

  if (state === 'listening') {   // 声に合わせて広がる波紋
    for (let i = 0; i < 3; i++) {
      const ph = ((time * 0.8 + i / 3) % 1);
      ctx.strokeStyle = hsl(cur.h, cur.s, cur.l + 10, (1 - ph) * (0.25 + lv * 0.6));
      ctx.lineWidth = Math.max(1, R * 0.02);
      ctx.beginPath(); ctx.arc(0, 0, R * (1.1 + ph * (0.6 + lv * 0.5)), 0, Math.PI * 2); ctx.stroke();
    }
  }
  ctx.globalCompositeOperation = 'source-over';
}

/* ===== ダンサー: 基準デザインを崩さない透過イラスト表示 ===== */
function drawDancer(R, time) {
  if (!dancerImageReady) {
    ctx.save();
    ctx.fillStyle = dancerImageError ? '#ff68ca' : '#62f7ff';
    ctx.font = `600 ${Math.max(13, R * 0.12)}px system-ui, sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillText(dancerImageError ? 'IMAGE ERROR' : 'LOADING…', 0, 0);
    ctx.restore();
    drawTicker(R, time);
    return;
  }

  const p = PALETTE[state];
  const k = 0.06;
  cur.h += (((p.h - cur.h + 540) % 360) - 180) * k;
  cur.h = (cur.h + 360) % 360;
  cur.s = lerp(cur.s, p.s, k); cur.l = lerp(cur.l, p.l, k);
  levelSmooth = lerp(levelSmooth, level, 0.25);
  const lv = levelSmooth;

  const dh = R * 4.4;
  const dw = dh * (dancerImage.naturalWidth / dancerImage.naturalHeight);
  const bob = Math.sin(time * 2.0) * R * 0.035;
  const sway = Math.sin(time * 1.15) * 0.025;
  const breathe = 1 + Math.sin(time * 2.0) * 0.012;

  ctx.save();

  ctx.translate(0, bob);

  ctx.drawImage(dancerImage, -dw / 2, -R * 2.15, dw, dh);
  ctx.filter = 'none';
  ctx.restore();

  drawTicker(R, time);
}

function drawChar(R, time) {
  const c = $('char').value;
  (c === 'mascot' ? drawMascot : c === 'dancer' ? drawDancer : c === 'ring' ? drawRing : drawOrb)(R, time);
}

/* ===== かわいいキャラ「ルミ」: 星の妖精の女の子(オリジナル)。感情で表情・色・身ぶりが変わる ===== */
const EMO = {

  happy:     { hue: 320, eye: 'happy', mouth: 'grin',  blush: 0.75, brow: 0,    raise: 0.03 },
  sad:       { hue: 225, eye: 'round', mouth: 'frown', blush: 0.10, brow: 1,    raise: 0 },

  shy:       { hue: 345, eye: 'shy',   mouth: 'wavy',  blush: 1.00, brow: 0.5,  raise: 0.02 },

/* ===== 画面レイアウト ===== */
function frame(now) {
  const time = (now - t0) / 1000;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);

  const mode = $('mode').value;
  const size = +$('size').value / 100;       // 画面短辺に対する割合
  const pos = +$('pos').value / 100;         // 0..1
  const side = Math.min(W, H);
  const R = side * size * 0.17;

  if (mode === 'plain') {
    ctx.save(); ctx.translate(W / 2, H * 0.42); drawChar(side * size * 0.3, time); ctx.restore();
  } else if (mode === 'board') {
    // 斜め板: 板で上下が反転して見えるので、あらかじめ上下反転して描く
    ctx.save(); ctx.translate(W / 2, H * (0.15 + pos * 0.6)); ctx.scale(1, -1); drawChar(R * 1.6, time); ctx.restore();
  } else {
    // ピラミッド: 中心から離れた4方向に、外向きが「上」になるよう配置
    const d = side * (0.16 + size * 0.22);
    for (let k = 0; k < 4; k++) {
      ctx.save();
      ctx.translate(W / 2, H * (0.2 + pos * 0.6));
      ctx.rotate(k * Math.PI / 2);
      ctx.translate(0, d); ctx.scale(1, -1);
      drawChar(R, time);
      ctx.restore();
    }
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ===== 音声: 既存の STT(hit-whisper-stt: ElevenLabs Scribe) と TTS(Aivisルーター) を中継APIごしに使う ===== */
let actx = null;
function ensureAudio() {
  if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
  if (actx.state === 'suspended') actx.resume();

}
const chatHistory = [];     // {role:'user'|'ai', text}
let emotion = 'neutral';
let emotionTimer = null;

// --- マイク → 16kHz PCM → WebSocket(音声区間だけ送る) ---
const WORKLET = "class P extends AudioWorkletProcessor{constructor(){super();this.b=new Float32Array(2048);this.n=0}process(i){const c=i[0][0];if(!c)return true;for(let k=0;k<c.length;k++){this.b[this.n++]=c[k];if(this.n===2048){this.port.postMessage(this.b.slice());this.n=0}}return true}}registerProcessor('pcm',P)";

const vad = { active: false, pre: [], queue: [], lastVoice: 0, t0: 0, voiced: 0, floor: 0.01, pendingEof: false, waiting: false };

function downsample(f32, inRate) {
  const ratio = inRate / 16000, n = Math.floor(f32.length / ratio), out = new Int16Array(n);
  for (let i = 0; i < n; i++) {
    const a = Math.floor(i * ratio), b = Math.min(f32.length, Math.floor((i + 1) * ratio));
    let s = 0; for (let j = a; j < b; j++) s += f32[j];
    out[i] = Math.max(-1, Math.min(1, s / Math.max(1, b - a))) * 32767;
  }
  return out;
}

function resetStt(next) {
  clearTimeout(finalTimer);
  try { ws && ws.close(); } catch (_) {}
  ws = null; wsOpen = false;
  vad.active = false; vad.pre = []; vad.queue = []; vad.pendingEof = false; vad.waiting = false; vad.voiced = 0;
  if (next !== false) setState(micOn ? 'listening' : 'idle');

function beginUtterance() {
  vad.active = true; vad.t0 = performance.now(); vad.voiced = 0; vad.pendingEof = false;
  vad.queue = vad.pre.slice(); vad.pre = [];
  ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}${CONFIG.sttPath}`);
  ws.binaryType = 'arraybuffer';
  ws.onopen = () => {
    wsOpen = true; ws.send(JSON.stringify({ type: 'start' }));
    for (const q of vad.queue) ws.send(q.buffer);
    vad.queue = [];
    if (vad.pendingEof) ws.send(JSON.stringify({ type: 'eof' }));
  };
  ws.onmessage = ev => {
    let m; try { m = JSON.parse(ev.data); } catch (_) { return; }
    if (m.type === 'partial' && m.text) { log('あなた: ' + m.text + ' …'); setUserCap(m.text, true); }
    else if (m.type === 'final') {
      const t = (m.text || '').trim(); resetStt(false);
      if (t) handleUtterance(t); else setState(micOn ? 'listening' : 'idle');
    } else if (m.type === 'error') { log('音声認識エラー: ' + m.message); resetStt(); }
  };
  ws.onerror = () => { if (vad.active || vad.waiting) { log('音声認識サーバーに接続できませんでした'); resetStt(); } };
}
function endUtterance() {
  vad.active = false;
  if (vad.voiced < 250) { resetStt(); return; }       // 短い物音は無視
  vad.waiting = true; log('認識中…');
  if (wsOpen) ws.send(JSON.stringify({ type: 'eof' })); else vad.pendingEof = true;
  clearTimeout(finalTimer); finalTimer = setTimeout(() => { log('音声認識が時間切れになりました'); resetStt(); }, 15000);
}
function sendPcm(pcm) { if (wsOpen) ws.send(pcm.buffer); else vad.queue.push(pcm); }

function onMicChunk(f32) {
  if (!micOn) return;
  let s = 0; for (let i = 0; i < f32.length; i++) s += f32[i] * f32[i];
  const rms = Math.sqrt(s / f32.length), now = performance.now();
  if (state !== 'listening') { vad.pre = []; return; }          // 考え中・話し中は聞かない(自分の声を拾わない)
  level = Math.min(1, rms * 6);
  if (vad.waiting) return;
  const pcm = downsample(f32, actx.sampleRate);
  const on = Math.max(0.02, vad.floor * 3), off = Math.max(0.012, vad.floor * 2);
  if (!vad.active) {
    if (rms < on) vad.floor = vad.floor * 0.98 + rms * 0.02;     // 周囲の雑音の大きさを学習
    vad.pre.push(pcm); if (vad.pre.length > 10) vad.pre.shift(); // 声が出る前の約0.4秒も送る
    if (rms > on) { beginUtterance(); vad.lastVoice = now; }
  } else {
    sendPcm(pcm);
    if (rms > off) { vad.lastVoice = now; vad.voiced += 43; }
    if (now - vad.lastVoice > 1000 || now - vad.t0 > 20000) endUtterance();
  }
}

async function startMic() {
  ensureAudio();
  if (!navigator.mediaDevices || !window.isSecureContext) { log('マイクには HTTPS が必要です → https://holo.s-quad.com/ で開いてください'); return false; }
  try { micStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, channelCount: 1 } }); }
  catch (e) { log('マイクを許可できませんでした: ' + e.message); return false; }
  const url = URL.createObjectURL(new Blob([WORKLET], { type: 'application/javascript' }));
  await actx.audioWorklet.addModule(url);
  micSrc = actx.createMediaStreamSource(micStream);
  micNode = new AudioWorkletNode(actx, 'pcm');
  micNode.port.onmessage = e => onMicChunk(e.data);
  const sink = actx.createGain(); sink.gain.value = 0;
  micSrc.connect(micNode); micNode.connect(sink); sink.connect(actx.destination);
  micOn = true; $('mic').classList.add('on'); $('mic').textContent = 'マイク停止';
  return true;
}
function stopMic() {
  micOn = false; resetStt(false);
  try { micNode && micNode.disconnect(); micSrc && micSrc.disconnect(); } catch (_) {}
  micStream && micStream.getTracks().forEach(t => t.stop()); micStream = null;
  $('mic').classList.remove('on'); $('mic').textContent = 'マイク開始'; level = 0; setState('idle');
}

// --- 返答(Claude) ---
const DEMO = ['こんにちは。ちゃんと聞こえていますよ。', 'なるほど、もう少し詳しく教えてください。', 'いいですね。一緒に考えてみましょう。', 'ありがとう。話してくれてうれしいです。'];
async function getReply(text) {
  if (CONFIG.chatEndpoint) {
    const r = await fetch(CONFIG.chatEndpoint, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ text, history: chatHistory.slice(-8) }) });
    if (!r.ok) throw new Error('chat ' + r.status);
    return await r.json();
  }
  await new Promise(r => setTimeout(r, 900));
  return { reply: DEMO[Math.floor(Math.random() * DEMO.length)], emotion: 'happy' };
}
async function handleUtterance(text) {
  if (state === 'thinking' || state === 'speaking') return;
  ensureAudio();
  setState('thinking'); level = 0; log('あなた: ' + text); setUserCap(text, false);
  clearTimeout(emotionTimer); emotion = 'neutral';
  let out;
  try { out = await getReply(text); } catch (e) { out = { reply: 'ごめんね、うまくつながらなかったみたい。', emotion: 'sad' }; }
  chatHistory.push({ role: 'user', text }, { role: 'ai', text: out.reply });
  while (chatHistory.length > 16) chatHistory.shift();
  speak(out.reply, out.emotion);
}

// --- 読み上げ(Aivis) → 再生音量でキャラを動かす ---
let playing = null;
async function speak(text, emo) {
  emotion = EMO[emo] ? emo : 'neutral';
  replyCap = { text, started: false, at: 0, dur: 0, endAt: 0 };
  setState('speaking'); log('ルミ: ' + text);
  const done = () => {
    level = 0; playing = null; replyCap.endAt = performance.now();
    emotionTimer = setTimeout(() => { emotion = 'neutral'; }, 5000);
    if (micOn) { resetStt(); } else setState('idle');
  };
  try {
    const r = await fetch(CONFIG.ttsEndpoint, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ text, emotion }) });
    if (!r.ok) throw new Error('tts ' + r.status);
    const buf = await ensureAudio().decodeAudioData(await r.arrayBuffer());
    const src = actx.createBufferSource(); src.buffer = buf;
    const an = actx.createAnalyser(); an.fftSize = 512; const tb = new Uint8Array(an.fftSize);
    src.connect(an); an.connect(actx.destination);
    const timer = setInterval(() => {
      an.getByteTimeDomainData(tb); let s = 0; for (const v of tb) { const d = (v - 128) / 128; s += d * d; }
      level = Math.min(1, Math.sqrt(s / tb.length) * 4);
    }, 40);
    playing = src;
    replyCap.dur = buf.duration * 900; replyCap.at = performance.now(); replyCap.started = true;
    src.onended = () => { clearInterval(timer); done(); };
    src.start();
  } catch (e) {                                   // TTSが使えないときはブラウザの声で代用
    log('ルミ: ' + text + '\n(ブラウザの声で再生: ' + e.message + ')');
    const u = new SpeechSynthesisUtterance(text); u.lang = CONFIG.lang;
    replyCap.dur = text.length * 170; replyCap.at = performance.now(); replyCap.started = true;
    let env = 0; const timer = setInterval(() => { env = Math.random() < 0.35 ? 0.2 + Math.random() * 0.7 : env * 0.7; level = env; }, 90);
    u.onend = u.onerror = () => { clearInterval(timer); done(); };
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  }
}

/* ===== UI ===== */
$('mic').onclick = async () => { ensureAudio(); micOn ? stopMic() : (await startMic()) && setState('listening'); };
$('say').addEventListener('keydown', e => {
  if (e.key !== 'Enter' || e.isComposing || e.keyCode === 229) return;   // IME変換確定のEnterは無視
  const v = e.target.value.trim(); if (!v) return; e.target.value = ''; ensureAudio(); handleUtterance(v);
});
$('hide').onclick = () => { $('ui').classList.add('hidden'); $('log').classList.add('hidden'); };
addEventListener('pointerdown', e => {          // 隠したあとは画面タップで戻す
  if ($('ui').classList.contains('hidden')) { $('ui').classList.remove('hidden'); $('log').classList.remove('hidden'); }
});
$('ui').addEventListener('pointerdown', e => e.stopPropagation());
for (const id of ['char', 'mode', 'size', 'pos']) $(id).addEventListener('change', () => { try { localStorage.setItem('orb2.' + id, $(id).value); } catch (_) {} });
for (const id of ['char', 'mode', 'size', 'pos']) $(id).addEventListener('input', () => { try { localStorage.setItem('orb2.' + id, $(id).value); } catch (_) {} });
for (const id of ['char', 'mode', 'size', 'pos']) { try { const v = localStorage.getItem('orb2.' + id); if (v) $(id).value = v; } catch (_) {} }
applyLogVisibility(); $('mode').addEventListener('change', applyLogVisibility); $('mode').addEventListener('input', applyLogVisibility);
log();
