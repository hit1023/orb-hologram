services:
  orb-hologram:
    image: nginx:alpine
    container_name: orb-hologram
    restart: unless-stopped
    depends_on:
      - orb-api
    ports:
      - "8897:80"
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./lumi3d.js:/usr/share/nginx/html/lumi3d.js:ro
      - ./dancer-concept.png:/usr/share/nginx/html/dancer-concept.png:ro
      - ./avatar3d.bundle.js:/usr/share/nginx/html/avatar3d.bundle.js:ro
      - ./dancer-avatar.glb:/usr/share/nginx/html/dancer-avatar.glb:ro
      - ./dancer-motion.glb:/usr/share/nginx/html/dancer-motion.glb:ro
      - ./dancer.mp4:/usr/share/nginx/html/dancer.mp4:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

  orb-api:
    build: ./orb-api
    container_name: orb-api
    restart: unless-stopped
    env_file: .env
    environment:
      TTS_ROUTER_URL: http://192.168.0.21:8000
      TTS_FALLBACK_URL: http://192.168.0.20:8000
      ZENOH_REST_URL: http://zenohd:8000     # 出来事を Zenoh にも publish する(zenohd がなくても本体は動く)
    volumes:
      - claude-config:/data/claude-config
      - orb-data:/data/db      # ユーザー・ログイン・ルミの気分(SQLite)

  # Zenoh(pub/sub のルーター)。orb-api が出来事を publish し、ブラウザ以外(Mac miniのスクリプト・ロボット等)が subscribe する
  #   REST(8000)は内部だけ。Zenoh本体(7447)だけをLANに出す
  zenohd:
    image: eclipse/zenoh:latest
    container_name: orb-zenohd
    restart: unless-stopped
    command: ["--rest-http-port", "8000"]
    ports:
      - "7447:7447"

volumes:
  claude-config:
  orb-data:
