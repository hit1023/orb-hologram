<text x="1234" y="288" font-size="12.5" fill="#334155">llama-3.3-70b-instruct-fp8-fast(約1秒) + bge-m3(RAG)</text>
<text x="1234" y="307" font-size="12.5" fill="#334155">AI Gateway「orb-hologram」経由(ログ/認証)</text>
<text x="1234" y="326" font-size="12.5" fill="#334155">出力: {reply, emotion, actions} / 興味・本音の分析</text>
<text x="1234" y="345" font-size="12.5" fill="#334155">失敗時 → Claude Code CLI(haiku)へ自動で戻る</text>
