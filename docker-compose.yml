services:
  orb-hologram:
    image: nginx:alpine
    container_name: orb-hologram
    restart: unless-stopped
    depends_on:
      - orb-api
    ports:
      - "8897:80"
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./dancer-concept.png:/usr/share/nginx/html/dancer-concept.png:ro
      - ./avatar3d.bundle.js:/usr/share/nginx/html/avatar3d.bundle.js:ro
      - ./dancer-avatar.glb:/usr/share/nginx/html/dancer-avatar.glb:ro
      - ./dancer-motion.glb:/usr/share/nginx/html/dancer-motion.glb:ro
      - ./dancer.mp4:/usr/share/nginx/html/dancer.mp4:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

  orb-api:
    build: ./orb-api
    container_name: orb-api
    restart: unless-stopped
    env_file: .env
    environment:
      TTS_ROUTER_URL: http://192.168.0.21:8000
      TTS_FALLBACK_URL: http://192.168.0.20:8000
    volumes:
      - claude-config:/data/claude-config

volumes:
  claude-config:
