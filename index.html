<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>ORB Hologram</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; touch-action: manipulation; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #ui { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
        display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-items: center;
        background: linear-gradient(transparent, rgba(0,0,0,.85)); transition: opacity .4s; font: 14px/1.4 system-ui, sans-serif; color: #cde; }
  #ui.hidden { opacity: 0; pointer-events: none; }
  button, select { font: inherit; color: #def; background: #123; border: 1px solid #357; border-radius: 10px; padding: 10px 14px; min-height: 44px; }
  button.on { background: #0a6; border-color: #3fc; color: #fff; }
  label { display: flex; align-items: center; gap: 6px; }
  input[type=range] { width: 110px; }
  #say { flex: 1 1 180px; min-width: 0; font: inherit; color: #def; background: #0a1520; border: 1px solid #357; border-radius: 10px; padding: 10px 12px; min-height: 44px; box-sizing: border-box; }
  #log { position: fixed; top: calc(8px + env(safe-area-inset-top)); left: 12px; right: 12px; font: 12px/1.5 system-ui, sans-serif; color: #7ab; pointer-events: none; white-space: pre-wrap; }
  #log.hidden { display: none; }
  button.sm { min-height: 36px; padding: 6px 10px; font-size: 13px; }
  #who { display: none; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: center; width: 100%; font-size: 13px; color: #9bd; }
  #who.on { display: flex; }
  #moodbar { display: inline-flex; gap: 6px; align-items: center; }
  .mb { display: inline-flex; align-items: center; gap: 3px; }
  .mb i { display: inline-block; width: 38px; height: 6px; border-radius: 3px; background: #1b2a38; overflow: hidden; position: relative; }
  .mb i b { position: absolute; left: 0; top: 0; bottom: 0; width: 0; transition: width .6s; }
  .overlay { position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(0,4,10,.92); font: 14px/1.5 system-ui, sans-serif; color: #cde; overflow-y: auto; }
  .overlay[hidden] { display: none; }
  #login { z-index: 30; }   /* ログインが切れたら、管理画面より手前に出す */
  .card { width: min(380px, 100%); box-sizing: border-box; display: flex; flex-direction: column; gap: 10px; padding: 22px; border: 1px solid #357; border-radius: 16px; background: #0a1520; }
  .card.wide { width: min(640px, 100%); max-height: calc(100vh - 32px); overflow-y: auto; }
  .card h1 { margin: 0 0 4px; font-size: 18px; color: #def; font-weight: 600; }
  .card input, .card select { font: inherit; color: #def; background: #06101a; border: 1px solid #357; border-radius: 10px; padding: 10px 12px; min-height: 44px; box-sizing: border-box; min-width: 0; }
  .card .err { min-height: 1.4em; color: #f99; font-size: 13px; }
  .card .ok { color: #7e9; }
  button.primary { background: #0a6; border-color: #3fc; color: #fff; }
  button.danger { border-color: #a45; color: #f99; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .row > input { flex: 1 1 130px; }
  .urow { display: grid; grid-template-columns: 1fr auto; gap: 6px 10px; padding: 10px 0; border-top: 1px solid #1d3347; align-items: center; }
  .urow .nm { font-weight: 600; color: #def; }
  .urow .sub { font-size: 12px; color: #7ab; grid-column: 1 / -1; }
  .urow .acts { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  .tag { font-size: 11px; padding: 1px 7px; border-radius: 8px; border: 1px solid #357; color: #9bd; margin-left: 6px; }
  .tag.admin { border-color: #c93; color: #fc6; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="log"></div>
<div id="ui">
  <select id="char" aria-label="キャラ">
    <option value="mascot3d">ルミ3D(回る)</option>
    <option value="mascot">ルミ(平ら)</option>
    <option value="ring">リング</option>
    <option value="dancer">ダンス</option>
    <option value="orb">球体</option>
  </select>
  <select id="mode" aria-label="表示モード">
    <option value="plain">通常(画面で確認)</option>
    <option value="board">斜め板(1枚)</option>
    <option value="pyramid">ピラミッド(4方向)</option>
  </select>
  <button id="pyrFlip" title="ピラミッドの横顔(左右)の向きを入れ替える。見ている向きが逆だったときに押す" style="display:none">向き反転</button>
  <button id="mic">マイク開始</button>
  <button id="duplex" title="話している途中でも割り込める(全二重)">割込: ON</button>
  <button id="topicBtn" title="しばらく話しかけないと、ルミがニュースの話題を出す(あなたの興味に合わせて)">話題: ON</button>
  <input id="say" placeholder="話しかける(文字でもOK)" enterkeyhint="send">
  <label>大きさ<input id="size" type="range" min="25" max="100" value="60"></label>
  <label>位置<input id="pos" type="range" min="0" max="100" value="50"></label>
  <button id="hide">UIを隠す</button>
  <div id="who">
    <span id="meName"></span>
    <span id="moodbar" title="ルミの気分(よろこび・いかり・かなしみ)">
      <span class="mb">😊<i><b id="mbJ" style="background:#fc4"></b></i></span>
      <span class="mb">😠<i><b id="mbA" style="background:#f55"></b></i></span>
      <span class="mb">😢<i><b id="mbS" style="background:#5af"></b></i></span>
      <span class="mb">💗<i><b id="mbF" style="background:#f8a"></b></i></span>
    </span>
    <button id="jobBadge" class="sm" style="display:none" title="調べ物の状況">🔎</button>
    <span id="wx" title=""></span>
    <button id="geoBtn" class="sm" title="位置情報から、いまの天気と気温をルミが知る(約1kmに丸めて使います)">位置: ON</button>
    <button id="adminBtn" class="sm" style="display:none">管理</button>
    <button id="pwBtn" class="sm">パスワード変更</button>
    <button id="forgetBtn" class="sm" title="ルミが覚えている、あなたとの会話を全部消す">記憶を消す</button>
    <button id="logoutBtn" class="sm">ログアウト</button>
  </div>
</div>
<div id="login" class="overlay" hidden>
  <form id="loginForm" class="card">
    <h1>ルミにログイン</h1>
    <input id="lgUser" name="username" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="ユーザー名" required>
    <input id="lgPass" name="password" type="password" autocomplete="current-password" placeholder="パスワード" required>
    <div id="lgErr" class="err"></div>
    <button type="submit" class="primary">ログイン</button>
  </form>
</div>
<div id="pwModal" class="overlay" style="z-index:40" hidden>
  <form id="pwForm" class="card">
    <h1 id="pwTitle"></h1>
    <div id="pwFields"></div>
    <label style="font-size:13px;color:#9bd"><input id="pwShow" type="checkbox"> パスワードを表示</label>
    <div id="pwErr" class="err"></div>
    <div class="row" style="justify-content:flex-end"><button type="button" id="pwCancel" class="sm">キャンセル</button><button type="submit" class="primary sm">OK</button></div>
  </form>
</div>
<div id="jobs" class="overlay" hidden>
  <div class="card wide">
    <div class="row" style="justify-content:space-between"><h1>調べ物</h1><span><button id="jobsClear" class="sm">履歴を消す</button> <button id="jobsClose" class="sm">閉じる</button></span></div>
    <div id="jobsList"></div>
    <div class="err" style="color:#7ab">調べ終わったら、ルミが教えてくれます。</div>
  </div>
</div>
<div id="admin" class="overlay" hidden>
  <div class="card wide">
    <div class="row" style="justify-content:space-between"><h1>ユーザー管理</h1><button id="admClose" class="sm">閉じる</button></div>
    <div class="card" style="width:100%;padding:12px;gap:8px;background:#06101a;margin-bottom:6px">
      <div style="font-weight:600;color:#def">ルミの設定</div>
      <label><input type="checkbox" id="sResearch"> あとで調べて報告する(裏でClaudeがWeb検索)</label>
      <label><input type="checkbox" id="sTopic"> ルミから話題を出す(ニュース・天気)</label>
      <div class="row"><label>最初の話題まで <input id="sFirst" type="number" min="10" max="3600" style="width:84px"> 秒</label><label>話題の間隔 <input id="sInt" type="number" min="30" max="86400" style="width:96px"> 秒</label></div>
      <label><input type="checkbox" id="sWeather"> 位置情報から天気・気温を把握する</label>
      <label><input type="checkbox" id="sGuard"> 威圧されたら鎧でガードする</label>
      <label>パーティクル量 <select id="sPart"><option value="1">少</option><option value="2">ふつう</option><option value="3">多</option></select></label>
      <div class="row"><button id="sSave" class="primary sm" type="button">設定を保存</button><span id="sMsg" class="err ok"></span></div>
    </div>
    <form id="addForm" class="row">
      <input id="adUser" placeholder="ユーザー名(英数字 3〜32)" autocapitalize="none" autocomplete="off" spellcheck="false" required>
      <input id="adPass" type="password" placeholder="パスワード(8文字以上)" autocomplete="new-password" autocapitalize="none" spellcheck="false" required>
      <button type="button" id="adShow" class="sm">表示</button>
      <button type="button" id="adGen" class="sm">自動生成</button>
      <select id="adRole"><option value="user">一般</option><option value="admin">管理者</option></select>
      <button type="submit" class="primary sm">追加</button>
    </form>
    <div id="adMsg" class="err"></div>
    <div id="adList"></div>
  </div>
</div>
<script type="module" src="lumi3d.js"></script>
<script>
'use strict';
/* ===== 設定 ===== */
const CONFIG = {
  // 返答API: POST {text, history} → {reply, emotion}。TTS: POST {text, emotion} → mp3。STT: WebSocket(16kHz PCM)
  chatEndpoint: '/api/chat',
  ttsEndpoint: '/api/tts',
  actEndpoint: '/api/act',       // 動きの判断(Jev)。キーがなければ source:'none' が返り、返答API(Claude)の判断を使う
  sttPath: '/ws/stt',
  lang: 'ja-JP',
};

/* ===== 状態 ===== */
// idle(待機) / listening(聞いている) / thinking(考え中) / speaking(話している)
const PALETTE = {
  idle:      { h: 200, s: 90, l: 62 },
  listening: { h: 150, s: 90, l: 60 },
  thinking:  { h: 265, s: 85, l: 68 },
  speaking:  { h: 28,  s: 95, l: 64 },
};
let state = 'idle';
let level = 0;          // 0..1 聞く/話すの音量
let levelSmooth = 0;
const cur = { ...PALETTE.idle };   // なめらかに変化する現在色
let t0 = performance.now();

const $ = id => document.getElementById(id);
const cv = $('c'), ctx = cv.getContext('2d');
const dancerImage = new Image();
let dancerImageReady = false;
let dancerImageError = false;
dancerImage.onload = () => { dancerImageReady = true; };
dancerImage.onerror = () => { dancerImageError = true; };
dancerImage.src = 'dancer-concept.png?v=1';
let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
}
addEventListener('resize', resize); resize();

function setState(s) { state = s; log(); }
function log(extra) {
  $('log').textContent = `状態: ${({idle:'待機',listening:'聞いている',thinking:'考え中',speaking:'話している'})[state]}` + (extra ? '\n' + extra : '');
  // 「あなた:」「ルミ:」は大きな字幕・帯で出すので、板に映す字幕に出すのはエラーや案内だけ
  if (extra && !/^(あなた|ルミ|認識中)/.test(extra)) setNotice(extra);
}
// 左上の小さな状態表示は、板に映ると邪魔なので通常モード(画面確認)のときだけ出す
function applyLogVisibility() { $('log').style.display = $('mode').value === 'plain' ? '' : 'none'; $('pyrFlip').style.display = $('mode').value === 'pyramid' && $('char').value === 'mascot3d' ? '' : 'none'; }
$('pyrFlip').onclick = () => { pyrDir = -pyrDir; try { localStorage.setItem('orb.pyrDir', String(pyrDir)); } catch (_) {} };
$('char').addEventListener('change', () => applyLogVisibility());

/* ===== 球体の描画(加算合成。黒背景ほど明るく見える) ===== */
function hsl(h, s, l, a) { return `hsla(${h},${s}%,${l}%,${a})`; }
function lerp(a, b, k) { return a + (b - a) * k; }

/* ===== 字幕: 話しかけた言葉(認識結果)・ルミの返事・案内/エラー =====
   板で正しい向きに映る(反転した空間で描く)。文字の大きさは言葉ごとにバラバラ。横スクロールはしない。
   ルミが話し始めるまでは話しかけた言葉、話し始めたら返事を、声に合わせて少しずつ出す。 */
const CAP_FONT = '"Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif';
let userCap = { text: '', at: -1e9, partial: false }, notice = { text: '', at: -1e9 };
let replyCap = { text: '', started: false, at: 0, dur: 0, endAt: 0 };
function setUserCap(t, partial) { userCap = { text: t, at: performance.now(), partial: !!partial }; }
function setNotice(t) { notice = { text: t, at: performance.now() }; }

function capInfo() {
  const now = performance.now();
  if (now - notice.at < 6000) return { text: notice.text, life: 6000 - (now - notice.at), kind: 'notice', progress: 1 };
  if (replyCap.text && replyCap.started) {
    if (!replyCap.endAt) return { text: replyCap.text, life: 1e9, kind: 'reply', progress: replyCap.dur ? Math.min(1, (now - replyCap.at) / replyCap.dur) : 1 };
    const left = 6000 - (now - replyCap.endAt);
    if (left > 0) return { text: replyCap.text, life: left, kind: 'reply', progress: 1 };
  }
  if (!userCap.text) return null;
  const age = now - userCap.at;
  const waiting = state === 'thinking' || (state === 'speaking' && !replyCap.started);
  const life = userCap.partial ? 4000 - age : waiting ? 1e9 : 6000 - age;
  return life > 0 && age < 30000 ? { text: userCap.text, life, kind: 'user', progress: 1, partial: userCap.partial } : null;
}

function hash32(s) { let h = 2166136261; for (const c of s) { h ^= c.codePointAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
const segmenter = (typeof Intl !== 'undefined' && Intl.Segmenter) ? new Intl.Segmenter('ja', { granularity: 'word' }) : null;
function splitChunks(text) {
  const raw = [];
  if (segmenter) for (const s of segmenter.segment(text)) raw.push(s.segment);
  else { let i = 0; while (i < text.length) { const n = 2 + (hash32(text.slice(i, i + 3)) % 3); raw.push(text.slice(i, i + n)); i += n; } }
  const out = [];
  for (const c of raw) {                                            // 句読点は前の語に付ける。長すぎる語は分ける
    if (/^[、。！？!?,.…・]+$/.test(c) && out.length) { out[out.length - 1] += c; continue; }
    for (let i = 0; i < c.length; i += 6) out.push(c.slice(i, i + 6));
  }
  return out;
}
function chunkScale(chunk, idx, seed) {
  const h = hash32(chunk + idx + seed), plain = chunk.replace(/[、。！？!?,.…・\s]/g, '');
  if (!plain) return 1;
  if (/^[぀-ゟ]+$/.test(plain) && plain.length <= 2) return 0.78 + (h % 10) / 100;   // 助詞など: 小さく
  const r = (h % 100) / 100;
  return /[一-鿿゠-ヿ0-9A-Za-z]/.test(plain) ? 1.15 + r * 0.55 : 0.9 + r * 0.35; // 漢字・カタカナ・英数: 大きく
}
const capCache = { key: '', lay: null };
function layoutCaption(text, base, maxW) {
  const key = `${text}|${Math.round(base)}|${Math.round(maxW)}`;
  if (capCache.key === key) return capCache.lay;
  const chunks = splitChunks(text.replace(/\n+/g, ' '));
  let idx = 0;
  const items = chunks.map((t, i) => {
    const s = chunkScale(t, i, text.length);
    ctx.font = `bold ${base * s}px ${CAP_FONT}`;
    const it = { t, s, w: ctx.measureText(t).width, j: (hash32(t + i) % 100) / 100 - 0.5, start: idx };
    idx += t.length; return it;
  });
  const lines = []; let line = { items: [], w: 0, s: 1 };
  for (const it of items) {
    if (line.items.length && line.w + it.w > maxW) { lines.push(line); line = { items: [], w: 0, s: 1 }; }
    line.items.push(it); line.w += it.w; line.s = Math.max(line.s, it.s);
  }
  if (line.items.length) lines.push(line);
  let y = 0;
  for (const l of lines) { l.h = base * l.s * 1.3; l.y = y; y += l.h; }
  capCache.key = key; capCache.lay = { lines, h: y, len: idx };
  return capCache.lay;
}

function drawCaption(R, cap) {
  let base = Math.max(18, Math.min(R * 0.30, W * 0.06));
  const maxW = W * 0.88;
  ctx.save();
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  let lay = layoutCaption(cap.text, base, maxW);
  while (lay.h > H * 0.34 && base > 14) { base *= 0.9; lay = layoutCaption(cap.text, base, maxW); }
  // 画面からはみ出さないように位置を調整する(板で上下反転していても、画面上の位置で判断)
  let top = R * 2.05;
  const m = ctx.getTransform(), d = m.d / DPR;
  if (Math.abs(d) > 0.001) {
    const scr = y => m.f / DPR + d * y;
    const a1 = scr(top), a2 = scr(top + lay.h), lo = Math.min(a1, a2), hi = Math.max(a1, a2);
    const limitBot = H - ($('ui').classList.contains('hidden') ? 10 : $('ui').offsetHeight + 10);
    let shift = 0;
    if (hi > limitBot) shift = limitBot - hi; else if (lo < 10) shift = 10 - lo;
    top += shift / d;
  }
  const n = Math.ceil(lay.len * cap.progress);                      // 返事は声に合わせて出す字数
  const a = Math.min(1, cap.life / 1200) * (cap.partial ? 0.8 : 1);
  ctx.shadowColor = hsl(cur.h, 90, 70, a * 0.9); ctx.shadowBlur = base * 0.5;
  for (const l of lay.lines) {
    let x = -l.w / 2;
    const bl = top + l.y + base * l.s * 1.0;
    for (const it of l.items) {
      if (it.start >= n) break;
      const t = it.start + it.t.length <= n ? it.t : it.t.slice(0, n - it.start);
      ctx.font = `bold ${base * it.s}px ${CAP_FONT}`;
      ctx.fillStyle = cap.kind === 'notice' ? `rgba(255,190,110,${a})` : hsl(cur.h, it.s > 1.1 ? 70 : 25, it.s > 1.1 ? 90 : 96, a * (it.s < 0.95 ? 0.85 : 1));
      ctx.fillText(t, x, bl + it.j * base * 0.25);
      x += it.w;
    }
  }
  ctx.restore();
}
// 全キャラ共通で呼ばれる。字幕があるときだけ出す(流れる帯はなし)
function drawTicker(R, time) { const cap = capInfo(); if (cap) drawCaption(R, cap); }

function drawOrb(R, time) {
  // 呼び出し側で原点=球の中心にしてある
  const p = PALETTE[state];
  const k = 0.06;
  cur.h += (((p.h - cur.h + 540) % 360) - 180) * k;   // 色相は最短経路で補間
  cur.h = (cur.h + 360) % 360;
  cur.s = lerp(cur.s, p.s, k); cur.l = lerp(cur.l, p.l, k);
  levelSmooth = lerp(levelSmooth, level, 0.25);
  const lv = levelSmooth;

  // 常に動き続ける: ゆっくりふわふわ漂い、呼吸し、表面が波打つ
  ctx.translate(Math.sin(time * 0.7) * R * 0.07, Math.sin(time * 1.1 + 1) * R * 0.09);
  const breathe = 1 + Math.sin(time * 1.4) * 0.06 + Math.sin(time * 2.3) * 0.015;
  const energy = state === 'idle' ? 0.26 : state === 'thinking' ? 0.3 : 0.32 + lv * 0.9;
  ctx.globalCompositeOperation = 'lighter';

  // 外側の光(ハロー)
  const halo = ctx.createRadialGradient(0, 0, R * 0.2, 0, 0, R * (1.9 + lv * 0.6));
  halo.addColorStop(0, hsl(cur.h, cur.s, cur.l, 0.35 + lv * 0.25));
  halo.addColorStop(1, hsl(cur.h, cur.s, cur.l, 0));
  ctx.fillStyle = halo;
  ctx.beginPath(); ctx.arc(0, 0, R * (1.9 + lv * 0.6), 0, Math.PI * 2); ctx.fill();

  drawTicker(R, time);

  // 本体: 音量で表面がうねるブロブ(重ね描きでガラス玉っぽく)
  for (let layer = 0; layer < 3; layer++) {
    const lr = R * (1 - layer * 0.08) * breathe;
    const N = 72;
    ctx.beginPath();
    for (let i = 0; i <= N; i++) {
      const a = (i / N) * Math.PI * 2;
      const wob =
        Math.sin(a * 3 + time * (1.2 + layer * 0.5)) * 0.5 +
        Math.sin(a * 5 - time * (1.7 + layer * 0.3)) * 0.3 +
        Math.sin(a * 2 + time * 0.7) * 0.4;
      const rr = lr * (1 + wob * energy * 0.45);
      const x = Math.cos(a) * rr, y = Math.sin(a) * rr;
      i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    }
    ctx.closePath();
    const g = ctx.createRadialGradient(-lr * 0.3, -lr * 0.35, lr * 0.05, 0, 0, lr * 1.05);
    g.addColorStop(0, hsl(cur.h, cur.s - 10, 82, 0.75));
    g.addColorStop(0.35, hsl(cur.h, cur.s, cur.l - 2, 0.5));
    g.addColorStop(1, hsl(cur.h, cur.s, cur.l - 30, 0.22));
    ctx.fillStyle = g; ctx.fill();
  }

  // 輪郭の光
  ctx.lineWidth = Math.max(1.5, R * 0.025);
  ctx.strokeStyle = hsl(cur.h, cur.s, cur.l + 12, 0.85);
  ctx.beginPath(); ctx.arc(0, 0, R * breathe * (1 + lv * 0.06), 0, Math.PI * 2); ctx.stroke();

  // 球の表面に散らした光の点を回転させて立体に見せる(手前=大きく明るい / 奥=小さく暗い)
  const NS = 90, tilt = 0.45, spin = time * (state === 'thinking' ? 1.4 : 0.6);
  for (let i = 0; i < NS; i++) {
    const phi = Math.acos(1 - 2 * (i + 0.5) / NS);
    const th = i * 2.399963 + spin;
    const x0 = Math.sin(phi) * Math.cos(th), y0 = Math.cos(phi), z0 = Math.sin(phi) * Math.sin(th);
    const y1 = y0 * Math.cos(tilt) - z0 * Math.sin(tilt);
    const z1 = y0 * Math.sin(tilt) + z0 * Math.cos(tilt);
    const dep = (z1 + 1) / 2;
    ctx.fillStyle = hsl(cur.h, cur.s, 60 + dep * 30, 0.12 + dep * dep * 0.85);
    ctx.beginPath(); ctx.arc(x0 * R * 0.97, y1 * R * 0.97, R * (0.012 + 0.03 * dep), 0, Math.PI * 2); ctx.fill();

  // 常時: 球のまわりをゆっくり回る小さな光の粒(状態を問わず動き続ける)
  for (let i = 0; i < 6; i++) {
    const a = time * (0.35 + i * 0.05) + i * 1.05;
    const rr = R * (1.55 + Math.sin(time * 0.9 + i * 2) * 0.15);
    ctx.fillStyle = hsl(cur.h, cur.s, 85, 0.5 + Math.sin(time * 2 + i) * 0.25);
    ctx.beginPath(); ctx.arc(Math.cos(a) * rr, Math.sin(a) * rr * 0.8, R * (0.025 + (i % 3) * 0.01), 0, Math.PI * 2); ctx.fill();
  }

  // 状態ごとの演出
  if (state === 'listening') {            // 声に合わせて広がる波紋
    for (let i = 0; i < 3; i++) {
      const ph = ((time * 0.8 + i / 3) % 1);
      ctx.strokeStyle = hsl(cur.h, cur.s, cur.l + 10, (1 - ph) * (0.25 + lv * 0.6));
      ctx.lineWidth = Math.max(1, R * 0.02);
      ctx.beginPath(); ctx.arc(0, 0, R * (1.05 + ph * (0.6 + lv * 0.5)), 0, Math.PI * 2); ctx.stroke();
    }
  } else if (state === 'thinking') {      // 周回する光の粒
    for (let i = 0; i < 9; i++) {
      const a = time * 2.2 + i * (Math.PI * 2 / 9);
      const rr = R * (1.3 + Math.sin(time * 2 + i) * 0.08);
      ctx.fillStyle = hsl(cur.h, cur.s, 80, 0.85);
      ctx.beginPath(); ctx.arc(Math.cos(a) * rr, Math.sin(a) * rr * 0.9, R * 0.045, 0, Math.PI * 2); ctx.fill();
    }
  } else if (state === 'speaking') {      // 話すリズムで脈打つリング
    ctx.strokeStyle = hsl(cur.h, cur.s, cur.l + 14, 0.2 + lv * 0.6);
    ctx.lineWidth = Math.max(1.5, R * 0.03);
    ctx.beginPath(); ctx.arc(0, 0, R * (1.15 + lv * 0.35), 0, Math.PI * 2); ctx.stroke();
  }
  ctx.globalCompositeOperation = 'source-over';
}


/* ===== リング状のキャラ: 3つの輪が立体的に回る ===== */
function rot3(x, y, z, ax, ay, az) {
  let y1 = y * Math.cos(ax) - z * Math.sin(ax), z1 = y * Math.sin(ax) + z * Math.cos(ax); y = y1; z = z1;
  let x1 = x * Math.cos(ay) + z * Math.sin(ay); z1 = -x * Math.sin(ay) + z * Math.cos(ay); x = x1; z = z1;
  x1 = x * Math.cos(az) - y * Math.sin(az); y1 = x * Math.sin(az) + y * Math.cos(az);
  return [x1, y1, z1];
}

function drawRing(R, time) {
  const p = PALETTE[state];
  const k = 0.06;
  cur.h += (((p.h - cur.h + 540) % 360) - 180) * k;
  cur.h = (cur.h + 360) % 360;
  cur.s = lerp(cur.s, p.s, k); cur.l = lerp(cur.l, p.l, k);
  levelSmooth = lerp(levelSmooth, level, 0.25);
  const lv = levelSmooth;

  ctx.translate(Math.sin(time * 0.7) * R * 0.05, Math.sin(time * 1.1 + 1) * R * 0.07);
  ctx.globalCompositeOperation = 'lighter';
  drawTicker(R, time);

  const sp = state === 'thinking' ? 2.4 : state === 'speaking' ? 1.3 + lv * 2.5 : state === 'listening' ? 1.1 : 0.8;
  const grow = state === 'speaking' ? 1 + lv * 0.25 : 1 + Math.sin(time * 1.4) * 0.03;
  const lw = Math.max(2, R * 0.05);

  // 中心の光(芯)
  const cr = R * (0.2 + lv * 0.18) * (1 + Math.sin(time * 2.2) * 0.08);
  const core = ctx.createRadialGradient(0, 0, 0, 0, 0, cr * 2.4);
  core.addColorStop(0, hsl(cur.h, cur.s - 10, 88, 0.95));
  core.addColorStop(0.4, hsl(cur.h, cur.s, cur.l, 0.5));
  core.addColorStop(1, hsl(cur.h, cur.s, cur.l, 0));
  ctx.fillStyle = core; ctx.beginPath(); ctx.arc(0, 0, cr * 2.4, 0, Math.PI * 2); ctx.fill();

  const rings = [
    { r: 1.00, ax: time * 0.9 * sp,       ay: 0.35,                  az: 0.2 },
    { r: 0.80, ax: 1.1,                   ay: time * 1.1 * sp,       az: time * 0.2 },
    { r: 0.60, ax: time * 0.7 * sp + 2,   ay: time * 0.5 * sp,       az: 0.9 },
  ];
  const N = 96;
  rings.forEach((rg, idx) => {
    const rr = R * rg.r * grow;
    let prev = null;
    for (let i = 0; i <= N; i++) {
      const t = (i / N) * Math.PI * 2;
      const [x, y, z] = rot3(Math.cos(t), Math.sin(t), 0, rg.ax, rg.ay, rg.az);
      const sc = 1 / (1 - z * 0.2);
      const q = [x * rr * sc, y * rr * sc, z];
      if (prev) {
        const d = ((q[2] + prev[2]) / 2 + 1) / 2;
        ctx.strokeStyle = hsl(cur.h, cur.s, 50 + d * 25, 0.18 + d * 0.6);
        ctx.lineWidth = lw * (0.45 + d * 0.9);
        ctx.lineCap = 'butt';
        ctx.beginPath(); ctx.moveTo(prev[0], prev[1]); ctx.lineTo(q[0], q[1]); ctx.stroke();
      }
      prev = q;
    }
    // 輪の上を走る光の玉(動きが見える)
    const beads = state === 'thinking' ? 3 : 1;
    for (let b = 0; b < beads; b++) {
      const t = time * sp * (1.2 + idx * 0.3) * (idx % 2 ? -1 : 1) + b * (Math.PI * 2 / beads) + idx;
      const [x, y, z] = rot3(Math.cos(t), Math.sin(t), 0, rg.ax, rg.ay, rg.az);
      const sc = 1 / (1 - z * 0.2), d = (z + 1) / 2;
      ctx.fillStyle = hsl(cur.h, cur.s - 10, 92, 0.35 + d * 0.65);
      ctx.beginPath(); ctx.arc(x * rr * sc, y * rr * sc, R * (0.035 + 0.04 * d), 0, Math.PI * 2); ctx.fill();
    }
  });

  if (state === 'listening') {   // 声に合わせて広がる波紋
    for (let i = 0; i < 3; i++) {
      const ph = ((time * 0.8 + i / 3) % 1);
      ctx.strokeStyle = hsl(cur.h, cur.s, cur.l + 10, (1 - ph) * (0.25 + lv * 0.6));
      ctx.lineWidth = Math.max(1, R * 0.02);
      ctx.beginPath(); ctx.arc(0, 0, R * (1.1 + ph * (0.6 + lv * 0.5)), 0, Math.PI * 2); ctx.stroke();
    }
  }
  ctx.globalCompositeOperation = 'source-over';
}

/* ===== ダンサー: 基準デザインを崩さない透過イラスト表示 ===== */
function drawDancer(R, time) {
  if (!dancerImageReady) {
    ctx.save();
    ctx.fillStyle = dancerImageError ? '#ff68ca' : '#62f7ff';
    ctx.font = `600 ${Math.max(13, R * 0.12)}px system-ui, sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillText(dancerImageError ? 'IMAGE ERROR' : 'LOADING…', 0, 0);
    ctx.restore();
    drawTicker(R, time);
    return;
  }

  const p = PALETTE[state];
  const k = 0.06;
  cur.h += (((p.h - cur.h + 540) % 360) - 180) * k;
  cur.h = (cur.h + 360) % 360;
  cur.s = lerp(cur.s, p.s, k); cur.l = lerp(cur.l, p.l, k);
  levelSmooth = lerp(levelSmooth, level, 0.25);
  const lv = levelSmooth;

  const dh = R * 4.4;
  const dw = dh * (dancerImage.naturalWidth / dancerImage.naturalHeight);
  const bob = Math.sin(time * 2.0) * R * 0.035;
  const sway = Math.sin(time * 1.15) * 0.025;
  const breathe = 1 + Math.sin(time * 2.0) * 0.012;

  ctx.save();
  ctx.globalCompositeOperation = 'source-over';
  ctx.translate(0, bob);
  ctx.rotate(sway);
  ctx.scale(breathe, breathe);
  ctx.filter = `brightness(${1.08 + lv * 0.10}) saturate(1.12) drop-shadow(0 0 ${5 + lv * 7}px rgba(48,235,255,.72)) drop-shadow(0 0 9px rgba(255,48,205,.48))`;
  ctx.drawImage(dancerImage, -dw / 2, -R * 2.15, dw, dh);
  ctx.filter = 'none';
  ctx.restore();

  drawTicker(R, time);
}

function drawChar(R, time, view = 0) {
  const c = $('char').value;
  if (c === 'mascot3d') return drawMascot3D(R, time, view);       // ピラミッドでは、面ごとに別の方向から見たルミ(正面・横顔・後ろ姿)を描く
  (c === 'mascot' ? drawMascot : c === 'dancer' ? drawDancer : c === 'ring' ? drawRing : drawOrb)(R, time);
}

/* ===== かわいいキャラ「ルミ」: 星の妖精の女の子(オリジナル)。感情で表情・色・身ぶりが変わる ===== */
const EMO = {
  neutral:   { hue: 190, eye: 'round', mouth: 'smile', blush: 0.30, brow: 0,    raise: 0 },
  happy:     { hue: 320, eye: 'happy', mouth: 'grin',  blush: 0.75, brow: 0,    raise: 0.03 },
  sad:       { hue: 225, eye: 'round', mouth: 'frown', blush: 0.10, brow: 1,    raise: 0 },
  surprised: { hue: 50,  eye: 'wide',  mouth: 'o',     blush: 0.25, brow: 0,    raise: 0.10 },
  angry:     { hue: 5,   eye: 'angry', mouth: 'pout',  blush: 0.20, brow: -1,   raise: 0 },
  shy:       { hue: 345, eye: 'shy',   mouth: 'wavy',  blush: 1.00, brow: 0.5,  raise: 0.02 },
  thinking:  { hue: 265, eye: 'up',    mouth: 'flat',  blush: 0.25, brow: 0.3,  raise: 0.04 },
};
const mc = { hue: 190, blush: 0.3, brow: 0, raise: 0, tilt: 0, nextBlink: 2, blinkAt: -9 };
const MC = { HAIR1: '#ff8fd8', HAIR2: '#a98bff', SKIN: '#ffe6d8', DARK: '#4a2f7a', MOUTH: '#ff6b8e', STAR: '#ffe66d', MINT: '#7ff5df' };

function mcSparkle(x, y, r) {
  ctx.beginPath(); ctx.moveTo(x, y - r);
  ctx.quadraticCurveTo(x, y, x + r, y); ctx.quadraticCurveTo(x, y, x, y + r);
  ctx.quadraticCurveTo(x, y, x - r, y); ctx.quadraticCurveTo(x, y, x, y - r); ctx.fill();

function mcStar(x, y, r, rot) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = rot - Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.45 : r;
    i ? ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr) : ctx.moveTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
  }
  ctx.closePath(); ctx.fill();
}
function mcEye(sx, e, blink, lv) {
  const x = sx * 0.4, y = -0.28, k = e.eye;
  ctx.lineCap = 'round'; ctx.strokeStyle = MC.DARK;
  if (k === 'happy') {                       // にっこり目(^ ^)
    ctx.lineWidth = 0.065; ctx.beginPath(); ctx.arc(x, y + 0.06, 0.17, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke(); return;
  }
  if (blink > 0.55) {                         // まばたき
    ctx.lineWidth = 0.055; ctx.beginPath(); ctx.arc(x, y - 0.04, 0.16, Math.PI * 0.15, Math.PI * 0.85); ctx.stroke(); return;
  }
  const rx = k === 'wide' ? 0.21 : 0.19;
  const ry = (k === 'wide' ? 0.30 : k === 'angry' ? 0.20 : k === 'shy' ? 0.23 : 0.26) * (1 - blink * 0.9);
  let ox = 0, oy = 0;
  if (k === 'up') { ox = -0.04; oy = -0.07; }
  if (k === 'shy') { ox = -0.05; oy = 0.04; }
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); ctx.fill();
  const ir = ctx.createRadialGradient(x + ox, y + oy - 0.05, 0.02, x + ox, y + oy, ry);
  ir.addColorStop(0, '#d6fcff'); ir.addColorStop(0.5, '#6ee0ff'); ir.addColorStop(1, '#8a6bff');
  ctx.fillStyle = ir; ctx.beginPath(); ctx.ellipse(x + ox, y + oy, rx * 0.84, ry * 0.93, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#2b1a5e'; ctx.beginPath(); ctx.ellipse(x + ox, y + oy + 0.02, rx * (k === 'wide' ? 0.28 : 0.42), ry * (k === 'wide' ? 0.35 : 0.52), 0, 0, Math.PI * 2); ctx.fill();
  const hs = 1 + (state === 'listening' ? 0.4 : 0);
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(x + ox - 0.06, y + oy - 0.09, 0.055 * hs, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(x + ox + 0.06, y + oy + 0.07, 0.03 * hs, 0, Math.PI * 2); ctx.fill();
  ctx.lineWidth = k === 'angry' ? 0.075 : 0.05;
  ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, Math.PI * 1.05, Math.PI * 1.95); ctx.stroke();
}

function drawMascot(R, time) {
  const p = PALETTE[state], k = 0.06;
  cur.h += (((p.h - cur.h + 540) % 360) - 180) * k; cur.h = (cur.h + 360) % 360;
  cur.s = lerp(cur.s, p.s, k); cur.l = lerp(cur.l, p.l, k);
  const fx = updateActions(time);
  const key = state === 'thinking' ? 'thinking' : ((fx && fx.emo) || emotion);
  const e = EMO[key] || EMO.neutral;
  levelSmooth = lerp(levelSmooth, level, 0.3); const lv = levelSmooth;
  mc.blush = lerp(mc.blush, e.blush, 0.08); mc.brow = lerp(mc.brow, e.brow, 0.15); mc.raise = lerp(mc.raise, e.raise, 0.15);
  mc.hue += (((e.hue - mc.hue + 540) % 360) - 180) * 0.06; mc.hue = (mc.hue + 360) % 360;
  mc.tilt = lerp(mc.tilt, state === 'listening' ? 0.13 : state === 'thinking' ? -0.12 : 0, 0.08);
  if (time > mc.nextBlink) { mc.blinkAt = time; mc.nextBlink = time + 1.8 + Math.random() * 3.2; }
  const bt = time - mc.blinkAt, blink = bt >= 0 && bt < 0.18 ? Math.sin(bt / 0.18 * Math.PI) : 0;
  const sw = Math.sin(time * 1.7), sw2 = Math.sin(time * 1.3 + 1.5);
  const talk = state === 'speaking' ? 0.5 + lv : 0;

  ctx.save();
  ctx.scale(R, R);
  ctx.translate(0, Math.sin(time * 1.8) * 0.06 - (key === 'happy' ? Math.abs(Math.sin(time * 5)) * 0.05 : 0));
  const glow = (on) => { ctx.shadowColor = on ? hsl(mc.hue, 100, 72, 0.9) : 'transparent'; ctx.shadowBlur = on ? R * DPR * 0.14 : 0; };

  // オーラ
  const ag = ctx.createRadialGradient(0, -0.1, 0.3, 0, -0.1, 2.5);
  ag.addColorStop(0, hsl(mc.hue, 90, 70, 0.28 + lv * 0.25)); ag.addColorStop(1, hsl(mc.hue, 90, 70, 0));
  ctx.fillStyle = ag; ctx.beginPath(); ctx.arc(0, -0.1, 2.5, 0, Math.PI * 2); ctx.fill();
  // きらきら
  ctx.fillStyle = '#fff';
  for (let i = 0; i < 8; i++) {
    const a = time * 0.4 + i * 0.785, rr = 1.7 + Math.sin(time * 0.9 + i * 2) * 0.2;
    ctx.globalAlpha = 0.35 + 0.55 * Math.abs(Math.sin(time * 2 + i * 1.7));
    mcSparkle(Math.cos(a) * rr * 1.05, Math.sin(a) * rr * 0.95 - 0.1, 0.05 + (i % 3) * 0.03);
  }
  ctx.globalAlpha = 1;

  glow(true);
  // ツインテール(うしろ髪)
  for (const s of [-1, 1]) {
    const sx = s * (1.45 + (s < 0 ? sw : sw2) * 0.12 + talk * 0.05), ex = s * (1.2 + (s < 0 ? sw2 : sw) * 0.2);
    const g = ctx.createLinearGradient(0, -0.8, 0, 1.2); g.addColorStop(0, MC.HAIR1); g.addColorStop(1, MC.HAIR2);
    ctx.strokeStyle = g; ctx.lineWidth = 0.5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(s * 0.85, -0.85); ctx.quadraticCurveTo(sx, -0.05, ex, 1.0 + talk * 0.05); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,.28)'; ctx.lineWidth = 0.09;
    ctx.beginPath(); ctx.moveTo(s * 0.8, -0.8); ctx.quadraticCurveTo(sx - s * 0.1, -0.05, ex - s * 0.08, 0.9); ctx.stroke();
  }
  // 足
  for (const s of [-1, 1]) {
    const fy = 1.64 + Math.sin(time * 2.2 + s) * 0.03;
    ctx.strokeStyle = MC.SKIN; ctx.lineWidth = 0.16; ctx.beginPath(); ctx.moveTo(s * 0.2, 1.3); ctx.lineTo(s * 0.22, fy); ctx.stroke();
    ctx.fillStyle = '#ff7fc0'; ctx.beginPath(); ctx.ellipse(s * 0.23, fy + 0.04, 0.15, 0.1, 0, 0, Math.PI * 2); ctx.fill();
  }
  // ワンピース
  const bg = ctx.createLinearGradient(0, 0.4, 0, 1.5); bg.addColorStop(0, '#d9fff7'); bg.addColorStop(1, MC.MINT);
  ctx.fillStyle = bg; ctx.beginPath(); ctx.moveTo(-0.34, 0.42); ctx.lineTo(0.34, 0.42); ctx.lineTo(0.64, 1.28);
  for (let i = 0; i < 5; i++) {
    const x0 = 0.64 - i * 0.256, x1 = x0 - 0.256;
    ctx.quadraticCurveTo((x0 + x1) / 2, 1.46 + Math.sin(time * 2 + i) * 0.025, x1, 1.28);
  }
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = MC.STAR; mcStar(0, 0.95, 0.13, Math.sin(time) * 0.2);
  ctx.fillStyle = '#ff8fd8';                                  // リボン
  ctx.beginPath(); ctx.moveTo(0, 0.56); ctx.lineTo(-0.2, 0.46); ctx.lineTo(-0.2, 0.66); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(0, 0.56); ctx.lineTo(0.2, 0.46); ctx.lineTo(0.2, 0.66); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.arc(0, 0.56, 0.07, 0, Math.PI * 2); ctx.fill();

  // 頭(少しかしげる)
  ctx.save(); ctx.translate(0, 0.4); ctx.rotate(mc.tilt + sw * 0.02); ctx.translate(0, -0.4);
  const hg = ctx.createLinearGradient(0, -1.5, 0, 0.5); hg.addColorStop(0, MC.HAIR1); hg.addColorStop(1, MC.HAIR2);
  ctx.fillStyle = hg; ctx.beginPath(); ctx.ellipse(0, -0.5, 1.06, 0.98, 0, 0, Math.PI * 2); ctx.fill();   // うしろ髪
  const fg = ctx.createRadialGradient(-0.2, -0.7, 0.1, 0, -0.45, 1.0); fg.addColorStop(0, '#fff6ee'); fg.addColorStop(1, MC.SKIN);
  ctx.fillStyle = fg; ctx.beginPath(); ctx.ellipse(0, -0.45, 0.92, 0.84, 0, 0, Math.PI * 2); ctx.fill();   // 顔
  // アホ毛と星
  ctx.strokeStyle = MC.HAIR1; ctx.lineWidth = 0.08;
  const ax = 0.12 + sw * 0.08;
  ctx.beginPath(); ctx.moveTo(0, -1.4); ctx.quadraticCurveTo(0.28, -1.62, ax, -1.84); ctx.stroke();
  ctx.fillStyle = MC.STAR; mcStar(ax, -1.95, 0.14, time * 0.8);
  // 前髪
  ctx.fillStyle = hg; ctx.beginPath(); ctx.moveTo(-1.0, -0.45); ctx.arc(0, -0.5, 1.0, Math.PI * 0.97, Math.PI * 2.03);
  const base = x => -0.62 + 0.28 * Math.pow(x / 0.96, 2), n = 6, L = -0.96, Rr = 0.96;
  ctx.lineTo(Rr, base(Rr));
  for (let i = 0; i < n; i++) { const xa = Rr - (Rr - L) / n * i, xb = xa - (Rr - L) / n, xm = (xa + xb) / 2; ctx.quadraticCurveTo(xm, base(xm) + 0.2, xb, base(xb)); }

    ctx.strokeStyle = '#d99bff'; ctx.lineWidth = 0.2; ctx.beginPath(); ctx.moveTo(s * 0.9, -0.55); ctx.quadraticCurveTo(s * 1.02, -0.1, s * 0.86, 0.25); ctx.stroke();
    ctx.fillStyle = MC.STAR; mcStar(s * 0.72, -1.05, 0.13, s * 0.3);
  }

  turn++;                                              // 古い返事・古いTTSの結果は捨てる

  if (curU) { curU.onend = curU.onerror = null; curU = null; }
  try { speechSynthesis.cancel(); } catch (_) {}
  level = 0; clearTimeout(emotionTimer); emotion = baseEmo();           // 動きは止めない(自分の声に反応して動きが消えるのを防ぐ)
  if (replyCap) replyCap.endAt = performance.now();
}
async function speak(text, emo, actions) {
  const my = turn; try { emojiBurst(lastUserText + ' ' + text); } catch (_) {}
  emotion = EMO[emo] ? emo : 'neutral';
  replyCap = { text, started: false, at: 0, dur: 0, endAt: 0 };
  setState('speaking'); log('ルミ: ' + text);
  const done = () => {
    level = 0; playing = null; replyCap.endAt = performance.now(); lastAct = performance.now();
    emotionTimer = setTimeout(() => { emotion = baseEmo(); }, 5000);
    if (micOn) { resetStt(); } else setState('idle');
  };
  try {
    const r = await fetch(CONFIG.ttsEndpoint, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ text, emotion }) });
    if (!r.ok) throw new Error('tts ' + r.status);
    const buf = await ensureAudio().decodeAudioData(await r.arrayBuffer());
    if (my !== turn) return;                         // 待っている間に割り込まれた
    const src = actx.createBufferSource(); src.buffer = buf;
    const an = actx.createAnalyser(); an.fftSize = 512; const tb = new Uint8Array(an.fftSize);
    src.connect(an); an.connect(actx.destination);
    const timer = speakTimer = setInterval(() => {
      an.getByteTimeDomainData(tb); let s = 0; for (const v of tb) { const d = (v - 128) / 128; s += d * d; }
      outRms = Math.sqrt(s / tb.length); level = Math.min(1, outRms * 4);
    }, 40);
    playing = src;
    replyCap.dur = buf.duration * 900; replyCap.at = performance.now(); replyCap.started = true; if (!actDecided && (actions || []).length && (actions || []).join(',') !== fastPlayed) playActions(actions); fastPlayed = '';
    src.onended = () => { clearInterval(timer); done(); };
    src.start();
  } catch (e) {                                   // TTSが使えないときはブラウザの声で代用
    log('ルミ: ' + text + '\n(ブラウザの声で再生: ' + e.message + ')');
    const u = new SpeechSynthesisUtterance(text); u.lang = CONFIG.lang;
    replyCap.dur = text.length * 170; replyCap.at = performance.now(); replyCap.started = true; if (!actDecided && (actions || []).length && (actions || []).join(',') !== fastPlayed) playActions(actions); fastPlayed = '';
    let env = 0; const timer = setInterval(() => { env = Math.random() < 0.35 ? 0.2 + Math.random() * 0.7 : env * 0.7; level = env; }, 90);
    u.onend = u.onerror = () => { clearInterval(timer); done(); };
    curU = u; speechSynthesis.cancel(); speechSynthesis.speak(u);
  }
}

  const cs = 'abcdefghijkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789', a = new Uint32Array(14); crypto.getRandomValues(a);
  $('adPass').value = Array.from(a, v => cs[v % cs.length]).join('');
  $('adPass').type = 'text'; $('adShow').textContent = '隠す';          // 自動生成したものは、控えられるよう表示する
};
$('addForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const username = $('adUser').value.trim(), password = $('adPass').value;
  const r = await jsend('POST', '/api/admin/users', { username, password, role: $('adRole').value }); const j = await r.json();
  $('adMsg').className = 'err' + (r.ok ? ' ok' : '');
  if (!r.ok) { $('adMsg').textContent = j.error || '追加できませんでした'; return; }
  $('adMsg').textContent = `${username} を追加しました。パスワードを本人に伝えてください: ${password}`;
  $('adUser').value = ''; $('adPass').value = ''; $('adPass').type = 'password'; $('adShow').textContent = '表示'; loadUsers();
});
applyLogVisibility(); $('mode').addEventListener('change', applyLogVisibility); $('mode').addEventListener('input', applyLogVisibility);
log();
</script>
</body>
