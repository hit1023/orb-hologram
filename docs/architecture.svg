<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1220" width="1800" height="1220" font-family="'Hiragino Sans','Noto Sans JP','Helvetica Neue',Arial,sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7c3aed"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f97316"/></marker><marker id="az" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0d9488"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0ea5e9"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><filter id="s" x="-5%" y="-5%" width="110%" height="115%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity=".12"/></filter></defs>
<rect width="1800" height="1220" fill="#f8fafc"/>
<text x="40" y="50" font-size="30" fill="#0f172a" font-weight="700">ORB Hologram「ルミ」 アーキテクチャ(育てる・覚える・調べる・動く)</text>
<text x="40" y="78" font-size="15" fill="#64748b">スマホ+透明板(ペッパーズゴースト)で浮かぶAIキャラ。GPU不要 / 会話の往復 約1.5〜2秒 / 会話するほど育つ</text>
<rect x="30" y="100" width="300" height="780" rx="18" fill="#ede9fe" stroke="#c4b5fd"/>
<text x="50" y="130" font-size="17" fill="#5b21b6" font-weight="700">① ユーザー側(スマホ・板)</text>
<rect x="355" y="100" width="820" height="780" rx="18" fill="#e0f2fe" stroke="#7dd3fc"/>
<text x="375" y="130" font-size="17" fill="#0369a1" font-weight="700">② 自宅サーバー (jcom LAN)</text>
<rect x="1200" y="100" width="570" height="780" rx="18" fill="#fef3c7" stroke="#fcd34d"/>
<text x="1220" y="130" font-size="17" fill="#b45309" font-weight="700">③ 外部 AI / クラウド</text>
<g filter="url(#s)"><rect x="50" y="140" width="260" height="255" rx="12" fill="#fff" stroke="#a78bfa" stroke-width="1.6"/>
<text x="64" y="165" font-size="15" fill="#4c1d95" font-weight="700">ブラウザ (index.html 単一ファイル)</text>
<text x="64" y="188" font-size="12.5" fill="#334155">Canvas2D + three.js 3Dルミ(自作の部品)</text>
<text x="64" y="207" font-size="12.5" fill="#334155">VAD+PCM送信 / 割り込み(全二重)</text>
<text x="64" y="226" font-size="12.5" fill="#334155">動き約50種(もぐもぐ・寝る・怖がる)</text>
<text x="64" y="245" font-size="12.5" fill="#334155">自発行動 / 気分・好感度 / 字幕</text>
<text x="64" y="264" font-size="12.5" fill="#334155">パーティクル(進化先の粒・分析・鎧)</text>
<text x="64" y="283" font-size="12.5" fill="#334155">育ちパネル / 調べ物ボタン(📬)</text>
<text x="64" y="302" font-size="12.5" fill="#334155">管理メニュー(使用中のAI表示)</text>
</g>
<g filter="url(#s)"><rect x="50" y="415" width="260" height="170" rx="12" fill="#fff" stroke="#a78bfa" stroke-width="1.6"/>
<text x="64" y="440" font-size="15" fill="#4c1d95" font-weight="700">成長(たまごっち×会話)</text>
<text x="64" y="463" font-size="12.5" fill="#334155">🥚→✨→🐣→⭐ルミ→🌟ほしのルミ</text>
<text x="64" y="482" font-size="12.5" fill="#334155">話題の傾向で進化:</text>
<text x="64" y="501" font-size="12.5" fill="#334155">🔬🎨🧭🌸🛒🌷🐟😈</text>
<text x="64" y="520" font-size="12.5" fill="#334155">kinds.json に1件足すだけで増える</text>
</g>
