<rect x="30" y="900" width="1740" height="200" rx="14" fill="#fff" stroke="#e2e8f0"/>
<text x="50" y="928" font-size="16" fill="#0f172a" font-weight="700">会話の流れ</text>
<text x="50" y="956" font-size="13.5" fill="#334155">① 声(PCM)をWSSでgate経由 → ② h-1のSTT中継 → ③ ElevenLabsで文字起こし → 字幕。話し中・考え中も聞き続け、声が続けば割り込む(うんうんと相づち)</text>
<text x="50" y="983" font-size="13.5" fill="#334155">④ 同時に2本を並列実行: 返事=Cloudflare Workers AI(約1秒。気分・好感度・成長段階・記憶(RAG)・天気をプロンプトに合成) / ④' 動き・口調・話題=Jev(約0.15秒)</text>
<text x="50" y="1010" font-size="13.5" fill="#334155">⑤ 返事をAivis Cloudで音声化(約0.45秒、失敗時はh-2のCPU版) → 再生しながら口パク+字幕+動き。威圧されたら鎧でガード、怒りすぎると毒づく</text>
<text x="50" y="1037" font-size="13.5" fill="#334155">⑥ 「調べておいて」→ 裏でClaude Codeがヘッドレスで調査 → 完了をSSEでブラウザの「調べ物」ボタンへ(⑦ ニュース・天気は話題に使う)。⑧ 出来事は Zenoh にも publish</text>
<text x="50" y="1064" font-size="13.5" fill="#334155">成長: 会話のたびに経験値。300XPで、いちばん多かった話題の傾向(科学・芸術・冒険・癒し・お店屋さん…)に進化。進化先は kinds.json で増やせる(見た目・動き・粒・話し方)</text>
<rect x="30" y="1115" width="1740" height="85" rx="14" fill="#ecfdf5" stroke="#6ee7b7"/>
