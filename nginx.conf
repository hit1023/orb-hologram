server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    add_header Cache-Control "no-cache";
    add_header Permissions-Policy "microphone=(self)";
    location = /api/events {            # SSE(調査が終わった等の通知): バッファしない・長く保つ
        proxy_pass http://orb-api:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }
    location /api/ {
        proxy_pass http://orb-api:3000;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
        client_max_body_size 1m;
    }
    # 音声認識は既存の hit-whisper-stt(ElevenLabs Scribe中継)へWebSocketで中継する
    # ログインしている人だけ(orb-api にcookieを確認してもらう)
    location = /_auth {
        internal;
        proxy_pass http://orb-api:3000/api/auth/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
    }
    # 外部(ARCHPULSE公開版のWorker)向けの音声認識の入口。ログインではなく合言葉(?k=)で守る。合言葉はGit管理外の ap-key.inc に置く
    # ARCHPULSE公開版のWorkerが、自宅(h-1)のヘッドレスClaudeを借りる入口。認証は中継側のRELAY_KEYヘッダー
    location = /ap-relay {
        proxy_pass http://192.168.0.20:8899/api/raw;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_read_timeout 330s;
        client_max_body_size 1m;
    }
    location = /ws/stt-ext {
        include /etc/nginx/ap-key.inc;
        proxy_pass http://192.168.0.20:18010/ws/stt;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
    location /ws/stt {
        auth_request /_auth;
        proxy_pass http://192.168.0.20:18010;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
    location / { try_files $uri /index.html; }
}
