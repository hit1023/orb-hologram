<text x="1234" y="443" font-size="12.5" fill="#334155">非生成の選択式モデル /v1/systemone(約0.15秒)</text>
<text x="1234" y="462" font-size="12.5" fill="#334155">動き・口調・話題・意図・進化先の傾向を並列で選ぶ</text>
