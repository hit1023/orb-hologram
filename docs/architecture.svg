<text x="404" y="381" font-size="14" fill="#0c4a6e" font-weight="700">orb-api (Node 22 / :3000)   SQLite(node:sqlite) を volume に保存</text>
<rect x="404" y="398" width="172" height="86" rx="9" fill="#fff" stroke="#e2e8f0"/>
<text x="414" y="417" font-size="13" fill="#0c4a6e" font-weight="700">server.js</text>
<text x="414" y="434" font-size="11.5" fill="#334155">chat / act / tts / topic</text>
<text x="414" y="449" font-size="11.5" fill="#334155">report / jobs / SSE</text>
<rect x="586" y="398" width="172" height="86" rx="9" fill="#fff" stroke="#e2e8f0"/>
<text x="596" y="417" font-size="13" fill="#0c4a6e" font-weight="700">store.js</text>
<text x="596" y="434" font-size="11.5" fill="#334155">ユーザー・セッション・気分</text>
<text x="596" y="449" font-size="11.5" fill="#334155">履歴・成長・調べ物</text>
<rect x="768" y="398" width="172" height="86" rx="9" fill="#fff" stroke="#e2e8f0"/>
<text x="778" y="417" font-size="13" fill="#0c4a6e" font-weight="700">mood.js</text>
<text x="778" y="434" font-size="11.5" fill="#334155">よろこび・いかり・かなしみ</text>
<text x="778" y="449" font-size="11.5" fill="#334155">+ 好感度・本音の分析</text>
<rect x="950" y="398" width="172" height="86" rx="9" fill="#fff" stroke="#e2e8f0"/>
<text x="960" y="417" font-size="13" fill="#0c4a6e" font-weight="700">memory.js</text>
<text x="960" y="434" font-size="11.5" fill="#334155">RAG: bge-m3 で</text>
<text x="960" y="449" font-size="11.5" fill="#334155">過去の会話を思い出す</text>
<rect x="404" y="498" width="172" height="86" rx="9" fill="#fff" stroke="#e2e8f0"/>
<text x="414" y="517" font-size="13" fill="#0c4a6e" font-weight="700">growth.js + kinds.json</text>
<text x="414" y="534" font-size="11.5" fill="#334155">XP・段階・進化先</text>
<text x="414" y="549" font-size="11.5" fill="#334155">(データ駆動)</text>
<rect x="586" y="498" width="172" height="86" rx="9" fill="#fff" stroke="#e2e8f0"/>
<text x="596" y="517" font-size="13" fill="#0c4a6e" font-weight="700">research.js</text>
<text x="596" y="534" font-size="11.5" fill="#334155">裏の調べ物(claude -p)</text>
<text x="596" y="549" font-size="11.5" fill="#334155">Web検索のみ許可</text>
<rect x="768" y="498" width="172" height="86" rx="9" fill="#fff" stroke="#e2e8f0"/>
<text x="778" y="517" font-size="13" fill="#0c4a6e" font-weight="700">news.js / weather.js</text>
<text x="778" y="534" font-size="11.5" fill="#334155">Google News RSS</text>
<text x="778" y="549" font-size="11.5" fill="#334155">Open-Meteo</text>
<rect x="950" y="498" width="172" height="86" rx="9" fill="#fff" stroke="#e2e8f0"/>
<text x="960" y="517" font-size="13" fill="#0c4a6e" font-weight="700">bus.js</text>
<text x="960" y="534" font-size="11.5" fill="#334155">SSE でブラウザへ</text>
<text x="960" y="549" font-size="11.5" fill="#334155">Zenoh REST PUT</text>
<text x="404" y="605" font-size="12" fill="#0c4a6e" font-weight="700">プロンプト合成: 人格 + 成長段階/進化先 + 気分/好感度 + 記憶(RAG) + 天気 + 履歴</text>
<text x="404" y="626" font-size="12" fill="#334155">守り: 威圧→鎧 / 怒りの上限 / 自分のしくみは「わからない」/ 卵は話せない(段階で機能を解放)</text>
<text x="404" y="647" font-size="12" fill="#334155">ルミの独り言的な話題: 興味(Jev+LLMで抽出)→ ニュース / 天気から自発的に話しかける</text>
<text x="404" y="668" font-size="12" fill="#334155">調べ物: 約束 → ジョブ → 完了を SSE + Zenoh で通知 → 「調べ物」ボタンに結果</text>
