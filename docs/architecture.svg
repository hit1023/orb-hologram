<text x="64" y="630" font-size="15" fill="#4c1d95" font-weight="700">ホログラム(ペッパーズゴースト)</text>
<text x="64" y="653" font-size="12.5" fill="#334155">画面を上下反転して描画</text>
<text x="64" y="672" font-size="12.5" fill="#334155">黒=透明 → 像が空中に浮く</text>
<text x="64" y="691" font-size="12.5" fill="#334155">pyramid: 4方向(前・後・左・右)</text>
<text x="64" y="710" font-size="12.5" fill="#334155">暗い部屋 + 輝度最大</text>
<text x="64" y="729" font-size="12.5" fill="#334155">総額 約300円</text>
</g>
